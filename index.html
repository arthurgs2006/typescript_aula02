<!DOCTYPE html>

<html lang="pt-br">

<head>

  <meta charset="UTF-8" />

  <title>ConnectHub</title>

  <style>

    body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; }

    #lista { list-style: none; padding: 0; }

    #lista li {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 0.75rem 1rem;

      margin-bottom: 0.5rem;

      border: 1px solid #ddd;

      border-radius: 8px;

    }

    .info { display: flex; flex-direction: column; }

    .categoria { font-size: 0.75rem; color: #888; }

    .estrela {

      font-size: 1.5rem;

      cursor: pointer;

      background: none;

      border: none;

      line-height: 1;

    }

    .estrela.favoritado { color: gold; }

    .estrela.favoritado::before { content: "★"; }

    .estrela:not(.favoritado) { color: #ccc; }

    .estrela:not(.favoritado)::before { content: "☆"; }

  </style>

</head>

<body>

  <h1>📋 ConnectHub</h1>



  <p id="erro" style="color:red;"></p>



  <ul id="lista"></ul>



  <script src="contatos.js"></script>

</body>

</html>
